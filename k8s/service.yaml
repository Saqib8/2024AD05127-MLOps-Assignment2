apiVersion: v1
kind: Service
metadata:
  name: catdog-api
  labels:
    app: catdog-api
spec:
  # NodePort keeps this reachable on kind and minikube without an ingress
  # controller, which is all the assignment needs.
  type: NodePort
  selector:
    app: catdog-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
